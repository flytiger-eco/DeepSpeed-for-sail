name: ppu-linux-build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: pkg.flytiger-eco.com/docker_release/pytorch:sdk2.2.0-2.13.0-ubuntu24.04-cuda13.0-py312-20261001

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: python -m pip install build setuptools wheel ninja

      - name: 编译并安装 deepspeed-kernels
        working-directory: ${{ runner.temp }}
        run: |
          git clone --recurse-submodules https://github.com/deepspeedai/deepspeed-kernels.git
          cd deepspeed-kernels
          pip install -v .

      - name: build DeepSpeed wheel
        run: |
          export DS_BUILD_FP_QUANTIZER=0
          DS_BUILD_OPS=1 python -m build --wheel --no-isolation
